{% extends "base.html" %}

{% block title %}{{ taxonomy.name | title }} · {{ config.title }}{% endblock title %}

{% block content %}
<h1>{{ taxonomy.name | title }}</h1>
<ul class="tag-list">
  {% for term in terms %}
  <li><a href="{{ term.permalink }}">#{{ term.name }}</a> <span>({{ term.page_count }})</span></li>
  {% endfor %}
</ul>
{% endblock content %}
